# NetBox for the home lab (and later, work). Based on netbox-community/netbox-docker 5.1.2.
# Run ./setup.sh rather than `docker compose up` the first time: it generates the secrets in env/.
name: netbox

x-netbox: &netbox
  image: docker.io/netboxcommunity/netbox:${NETBOX_VERSION:-v4.7.5-5.1.2}
  restart: unless-stopped
  depends_on:
    - postgres
    - redis
    - redis-cache
  env_file: env/netbox.env
  user: "netbox:root"
  volumes:
    - netbox-media-files:/opt/netbox/netbox/media:rw
    - netbox-reports-files:/opt/netbox/netbox/reports:rw
    - netbox-scripts-files:/opt/netbox/netbox/scripts:rw
    # Site-specific settings (LDAP/SSO, plugins…) go in extra.py; it's empty by default.
    - ./extra.py:/etc/netbox/config/zz_extra.py:ro

services:
  netbox:
    <<: *netbox
    environment:
      # The image binds to [::], which crash-loops on hosts with IPv6 disabled. Docker's default
      # network is IPv4, so bind that; the later --host wins over the image's.
      GRANIAN_EXTRA_ARGS: "--host=0.0.0.0"
    ports:
      - "${NETBOX_BIND:-0.0.0.0}:${NETBOX_PORT:-8000}:8080"
    healthcheck:
      test: /opt/netbox/health.sh
      start_period: 600s # first start and upgrades run migrations; slow disks need minutes
      timeout: 3s
      interval: 15s

  netbox-worker:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s

  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-18-alpine}
    restart: unless-stopped
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    env_file: env/postgres.env
    volumes:
      - netbox-postgres:/var/lib/postgresql

  redis:
    image: docker.io/valkey/valkey:${VALKEY_VERSION:-9.1-alpine}
    restart: unless-stopped
    command:
      - sh
      - -c # evaluates $REDIS_PASSWORD from the env file
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data

  redis-cache:
    image: docker.io/valkey/valkey:${VALKEY_VERSION:-9.1-alpine}
    restart: unless-stopped
    command:
      - sh
      - -c
      - valkey-server --requirepass $$REDIS_PASSWORD
    healthcheck: *redis-healthcheck
    env_file: env/redis-cache.env
    volumes:
      - netbox-redis-cache-data:/data

volumes:
  netbox-media-files:
  netbox-postgres:
  netbox-redis-cache-data:
  netbox-redis-data:
  netbox-reports-files:
  netbox-scripts-files:
