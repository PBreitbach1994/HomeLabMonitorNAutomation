# Home Lab Control — your lab, read from NetBox.
# Copy to config/lab.yaml (git-ignored). Secrets come from env vars (.env): ${NAME} or ${NAME:-default}.
#
# NetBox supplies the devices, cabling, internet circuit, service tiles and most collector targets.
# This file only holds credentials and anything NetBox can't know. See docs/NETBOX.md for how
# to model things so the dashboard reads them.
#
# mode:
#   live  — real collectors only.
#   mixed — real collectors, with simulated traffic wherever nothing real reports yet.
#   demo  — simulated traffic over your NetBox topology (good for checking the map first).
mode: mixed

lab:
  name: Home Lab Control
  # timezone: America/Chicago # for "today" totals; defaults to the server's

netbox:
  url: ${NETBOX_URL}
  token: ${NETBOX_TOKEN} # read-only token is enough; v1 and v2 (nbt_…) tokens both work
  # site: home           # only this site's devices (slug); omit for all sites
  # refresh: 300         # seconds between topology refreshes
  # tag: dashboard       # services/VMs with this tag become service tiles
  # roles:               # device role slug → node kind, when the built-in guess is wrong
  #   edge-firewall: router
  #   lab-box: host
  collectors:
    snmp: # one SNMP collector per device tagged "snmp", at its primary IP
      version: 3 # 3 | 2c — 2c uses `community` instead of user/keys
      user: ${SNMP_USER}
      authProtocol: sha # md5 | sha | sha224 | sha256 | sha384 | sha512
      authKey: ${SNMP_AUTH_KEY}
      privProtocol: aes # des | aes | aes256b | aes256r
      privKey: ${SNMP_PRIV_KEY}
    glances: { port: 61208 } # devices tagged "glances"
    ping: { internet: 1.1.1.1 } # plus the router's primary IP
    # Set any of these to `false` to stop creating them.

# Optional overrides, matched by id (= NetBox device name / service name slug).
# topology:
#   nodes:
#     - id: gw-01
#       label: Gateway
# services: []

# Collectors NetBox can't infer. Hosts are NetBox device names.
collectors:
  - id: sim
    kind: simulator # only fills in what real collectors don't cover (mixed/demo)

  # Docker container state for service tiles. One per container host; prefer a socket proxy.
  - id: docker-srv-01
    kind: docker
    enabled: false
    host: srv-01
    url: http://srv-01:2375 # docker-socket-proxy (GET /containers only), or `socket: /var/run/docker.sock`
    interval: 15

  # UniFi switches: per-port counters from the controller, keyed <device>/<port name>.
  - id: unifi
    kind: unifi
    enabled: false
    url: https://unifi.local
    username: ${UNIFI_USER}
    password: ${UNIFI_PASS}
    site: default
    insecure: true # self-signed cert on the console
    devices: # switch MAC (quoted) -> NetBox device name
      "00:00:00:00:00:00": sw-rack
    interval: 10

  # --- Only if you run them. Download clients need `host` so their traffic is attributed. ---
  # - { id: sabnzbd, kind: sabnzbd, host: srv-01, url: http://srv-01:8080, apiKey: ${SABNZBD_API_KEY} }
  # - { id: qbittorrent, kind: qbittorrent, host: srv-01, url: http://srv-01:8081, username: ${QBIT_USER:-admin}, password: ${QBIT_PASS} }
  # - { id: sonarr, kind: sonarr, url: http://srv-01:8989, apiKey: ${SONARR_API_KEY} }
  # - { id: radarr, kind: radarr, url: http://srv-01:7878, apiKey: ${RADARR_API_KEY} }
  # - { id: lidarr, kind: lidarr, url: http://srv-01:8686, apiKey: ${LIDARR_API_KEY} }
  # - { id: seerr, kind: seerr, url: http://srv-01:5055, apiKey: ${SEERR_API_KEY} }
  # - { id: slskd, kind: slskd, host: srv-01, url: http://srv-01:5030, apiKey: ${SLSKD_API_KEY} }
  # - { id: plex, kind: plex, host: nas-01, url: http://nas-01:32400, token: ${PLEX_TOKEN}, clients: {} }
  # - { id: gluetun, kind: gluetun, host: srv-01, url: http://srv-01:8000, apiKey: ${GLUETUN_API_KEY:-} }
  # - { id: tailscale, kind: tailscale, socket: /var/run/tailscale/tailscaled.sock }
